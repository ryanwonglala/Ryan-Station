  <div class="grid-warp" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <aside class="playlist-sidebar" id="playlistSidebar">
    <button class="playlist-tab" id="playlistTab" aria-label="Toggle Playlist" data-i18n-aria-label="musicPlayer.playlistToggle">
      <span data-i18n="musicPlayer.playlist">Playlist</span>
      <svg class="icon" width="16" height="16" aria-hidden="true"><use href="#icon-music"></use></svg>
    </button>
    <div class="playlist-shell">
      <header>
        <h2 data-i18n="musicPlayer.playQueue">Play Queue</h2>
        <p id="playlistCount" aria-live="polite" aria-atomic="true">(0)</p>
      </header>
      <div class="playlist-search">
        <label class="playlist-search-label" for="playlistSearch" data-i18n="musicPlayer.searchLabel">Search tracks / 搜索曲目</label>
        <div class="playlist-search-row">
          <input
            id="playlistSearch"
            class="playlist-search-input"
            type="search"
            placeholder="Title, artist, or tag / 标题、歌手或标签"
            data-i18n-placeholder="musicPlayer.searchPlaceholder"
            autocomplete="off"
            enterkeyhint="search"
            aria-controls="playlistItems"
          >
          <button
            id="playlistSearchClear"
            class="playlist-search-clear"
            type="button"
            disabled
            aria-label="Clear playlist search / 清空播放列表搜索"
            data-i18n-aria-label="musicPlayer.clearSearch"
            title="Clear search / 清空搜索"
            data-i18n-title="musicPlayer.clearSearch"
          >
            <span aria-hidden="true">×</span>
          </button>
        </div>
      </div>
      <div class="playlist-items" id="playlistItems"></div>
      <p class="playlist-empty-state" id="playlistEmptyState" role="status" hidden data-i18n="musicPlayer.noSearchResults">No tracks match your search / 没有找到匹配的曲目</p>
    </div>
  </aside>

  <a href="index.html" class="back-home-btn" title="Back to Home" data-i18n-title="musicPlayer.home">
    <svg class="icon" width="16" height="16" aria-hidden="true"><use href="#icon-home"></use></svg>
    <span data-i18n="musicPlayer.home">Home</span>
  </a>

  <div class="music-language-switcher language-switcher" role="group" aria-label="Switch language" data-i18n-aria-label="common.switchLanguage">
    <button class="language-option is-active" type="button" data-lang="en" aria-pressed="true">EN</button>
    <button class="language-option" type="button" data-lang="zh" aria-pressed="false">中文</button>
  </div>

  <main class="brutalist-container">
    <section class="control-stack">
      <header class="zone-heading">
        <span class="heading-label" data-i18n="musicPlayer.headingLabel">Ryan Station</span>
        <h1 data-i18n="musicPlayer.title">Music Zone</h1>
      </header>
      <div class="vinyl-wrapper">
        <div class="tonearm" aria-hidden="true"></div>
        <div class="vinyl-frame">
          <div class="vinyl" id="vinylDisc">
            <div class="vinyl-label" id="vinylLabel"></div>
          </div>
        </div>
      </div>
      <pre class="track-data" id="trackData">
TITLE: <span class="track-title">No music loaded</span>
ARTIST: <span class="track-artist">--</span>
DURATION: <span class="track-duration">0:00</span>
      </pre>
      <div class="ai-terminal">
        <div class="ai-terminal-header">
          <span class="ai-terminal-label" data-i18n="musicPlayer.terminal">STATION DJ</span>
          <button id="terminal-toggle" class="terminal-toggle" type="button" aria-expanded="true" aria-controls="terminal-log" title="Collapse terminal log" data-i18n-title="musicPlayer.collapseTerminal">
            <svg class="icon" width="16" height="16" aria-hidden="true"><use href="#icon-chevron-up"></use></svg>
          </button>
        </div>
        <div class="mood-presets" id="moodPresets" role="group" aria-label="Quick mood picks" data-i18n-aria-label="musicPlayer.moodPresetsAria"></div>
        <div id="terminal-log" class="terminal-log" aria-live="polite">
          <div class="terminal-line system" data-i18n="musicPlayer.systemReady">&gt; SYSTEM: DJ booth online. Pick a mood.</div>
        </div>
      </div>
    </section>

    <section class="visual-stack">
      <div class="crt-tv">
        <video id="mv-player" class="crt-video" muted playsinline preload="metadata"></video>
        <canvas id="crtScope" class="crt-scope" aria-hidden="true"></canvas>
        <div class="static-noise"></div>
        <p class="crt-status" data-i18n="musicPlayer.noSignal">NO SIGNAL</p>
      </div>
      <div class="glitch-controls">
        <div class="time-display">
          <span id="currentTimeDisplay">0:00</span>
          <span id="totalTimeDisplay">0:00</span>
        </div>
        <canvas id="spectrumBar" class="spectrum-bar" aria-hidden="true"></canvas>
        <label for="seekBar" class="seek-label" data-i18n="musicPlayer.signalTracking">SIGNAL TRACKING</label>
        <input type="range" id="seekBar" min="0" max="100" value="0">
        <div class="button-grid">
          <button class="glitch-btn" id="modeBtnPlayer" title="Sequential play" aria-label="Sequential play"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#icon-list-ul"></use></svg></button>
          <button class="glitch-btn" id="prevBtnPlayer" title="Previous track" data-i18n-title="musicPlayer.controls.previous"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#icon-backward"></use></svg></button>
          <button class="glitch-btn play-btn" id="playBtnPlayer" title="Play / Pause" data-i18n-title="musicPlayer.controls.playPause"><svg class="icon" width="16" height="16" aria-hidden="true"><use id="playIconPlayer" href="#icon-play"></use></svg></button>
          <button class="glitch-btn" id="nextBtnPlayer" title="Next track" data-i18n-title="musicPlayer.controls.next"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#icon-forward"></use></svg></button>
          <button class="glitch-btn" id="volumeBtn" title="Volume" data-i18n-title="musicPlayer.controls.volume"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#icon-volume-up"></use></svg></button>
        </div>
        <div class="volume-control" id="volumeControl">
          <input type="range" min="0" max="100" value="100" id="volumeSlider">
        </div>
      </div>
    </section>
  </main>

  <div class="mascot-container">
    <img src="assets/music-zone.webp" alt="Ryan Station Mascot" data-i18n-alt="musicPlayer.mascotAlt">
  </div>

  <audio id="audioPlayer"></audio>
  <script src="playlist-data.js"></script>
  <script src="dj-lines-data.js"></script>
  <script src="i18n.js"></script>
  <script src="music-player.js?v=20260822-7"></script>
</body>
</html>
